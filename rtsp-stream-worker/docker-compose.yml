services:
  rtsp-stream-worker:
    build: .
    container_name: rtsp-stream-worker
    image: rtsp-stream-worker:latest
    user: "1000:1000"  # Run as non-root user inside the container
    ports:
      - "8000:8000" # FastAPI server
      - "8888:8888" # MediaMTX HLS server
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'   # Cap CPU so one container cannot peg the host; tune with MAX_CONCURRENT_STREAMS
