services:
  rtsp-stream-worker:
    build: .
    container_name: rtsp-stream-worker
    image: rtsp-stream-worker:latest
    ports:
      - "8000:8000" # FastAPI server
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
